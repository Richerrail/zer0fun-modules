[package]
name = "zer0fun-dosgames"
version = "0.1.0"
edition = "2021"
description = "Lanceur de jeux DOS via DOSBox (.IMA / .IMG / .EXE)"
authors = ["AI Generated"]

[lib]
crate-type = ["cdylib"]

[dependencies]
zer0fun-api = { path = "../zer0fun-api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1